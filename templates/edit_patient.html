<!DOCTYPE html>
<html>
<head>
    <title>Edit Patient</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">
    <a href="/">Home</a>
    <a href="/add">Add Patient</a>
    <a href="/patients">Patients</a>
    <a href="/dashboard">Dashboard</a>
</nav>

<div class="container">

    <h1>Edit Patient</h1>

    <form action="/edit/{{ patient[0] }}" method="POST">

        <label>Name</label>
        <input type="text"
               name="name"
               value="{{ patient[1] }}"
               required>

        <label>Age</label>
        <input type="number"
               name="age"
               value="{{ patient[2] }}"
               min="1"
               max="120"
               required>

        <label>Gender</label>
        <select name="gender" required>

            <option value="Male"
                {% if patient[3] == 'Male' %}selected{% endif %}>
                Male
            </option>

            <option value="Female"
                {% if patient[3] == 'Female' %}selected{% endif %}>
                Female
            </option>

            <option value="Other"
                {% if patient[3] == 'Other' %}selected{% endif %}>
                Other
            </option>

        </select>

        <label>Phone</label>
        <input type="tel"
               name="phone"
               value="{{ patient[4] }}"
               pattern="[0-9]{10}"
               maxlength="10"
               required>

        <label>Address</label>
        <input type="text"
               name="address"
               value="{{ patient[5] }}"
               required>

        <label>Test Result</label>
        <select name="test_result" required>

            <option value="Positive"
                {% if patient[6] == 'Positive' %}selected{% endif %}>
                Positive
            </option>

            <option value="Negative"
                {% if patient[6] == 'Negative' %}selected{% endif %}>
                Negative
            </option>

        </select>

        <label>Vaccination Status</label>
        <select name="vaccination_status" required>

            <option value="Vaccinated"
                {% if patient[7] == 'Vaccinated' %}selected{% endif %}>
                Vaccinated
            </option>

            <option value="Not Vaccinated"
                {% if patient[7] == 'Not Vaccinated' %}selected{% endif %}>
                Not Vaccinated
            </option>

        </select>

        <button type="submit">Update Patient</button>

    </form>

</div>

</body>
</html>
